<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comida Viva</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800;900&family=Outfit:wght@400;600;800&display=block" rel="stylesheet">
<style>
:root{--cereja:#E50145;--rosa:#FF87A0;--laranja:#F15A22;--areia:#F5D69E;--amarelo:#EFD600;--creme:#FFF9E9;--verde:#0C893E;--menta:#63E578;--roxo:#962E9D;--lilas:#FAC7FF;--tinta:#5C0A24;
 --display:"Barlow Condensed","Arial Narrow",sans-serif;--texto:"Outfit","Segoe UI",sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:74px}
body{margin:0;background:var(--cereja);color:var(--tinta);font:400 16px/1.4 var(--texto)}
.eyebrow{display:inline-block;font:800 14px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;background:var(--creme);color:var(--cereja);border-radius:7px;padding:8px 11px 6px;box-shadow:4px 4px 0 var(--tinta)}
/* topo */
header.capa{padding:56px 6vw 40px;color:var(--creme)}
header.capa h1{font:900 clamp(72px,13vw,190px)/.84 var(--display);text-transform:uppercase;margin:20px 0 0}
header.capa h1 em{font-style:normal;color:var(--rosa);display:block}
header.capa p{max-width:760px;font-size:20px;margin:22px 0 0}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.meta span{font:800 15px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;background:var(--tinta);color:var(--creme);border-radius:999px;padding:9px 14px 7px}
/* barra fixa */
nav.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--tinta);color:var(--creme);display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:11px 6vw;box-shadow:0 6px 0 rgba(92,10,36,.25)}
nav.barra a{color:var(--creme);text-decoration:none;font:800 14px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:7px 10px 5px;border-radius:999px;background:rgba(255,249,233,.12)}
nav.barra a:hover{background:var(--creme);color:var(--cereja)}
nav.barra .sep{flex:1}
nav.barra input{font:600 15px var(--texto);border:0;border-radius:999px;padding:8px 14px;width:190px;background:var(--creme);color:var(--tinta);outline:none}
nav.barra button,nav.barra select{font:800 14px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;border:0;border-radius:999px;padding:8px 13px 6px;background:var(--amarelo);color:var(--tinta);cursor:pointer}
.chipfundo{display:inline-flex;gap:5px;align-items:center;font:800 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase}
.chipfundo i{width:20px;height:20px;border-radius:50%;border:2px solid var(--creme);cursor:pointer;display:inline-block}
.chipfundo i.on{outline:3px solid var(--amarelo);outline-offset:1px}
/* faixas de conteúdo */
section.bloco{padding:46px 6vw 20px}
section.bloco.claro{background:var(--creme)}
section.bloco.rosa{background:var(--rosa)}
.bloco h2{font:900 clamp(44px,7vw,88px)/.9 var(--display);text-transform:uppercase;margin:14px 0 6px;color:var(--creme)}
.bloco.claro h2,.bloco.rosa h2{color:var(--cereja)}
.bloco h2 small{font:800 22px/1 var(--display);letter-spacing:.14em;opacity:.7;margin-left:12px}
.lede{max-width:820px;font-size:18px;margin:6px 0 26px;color:var(--creme);opacity:.95}
.bloco.claro .lede,.bloco.rosa .lede{color:var(--tinta)}
.grade{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.grade.vert{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.grade.larga{grid-template-columns:repeat(auto-fill,minmax(440px,1fr))}
/* cartão da peça */
.card{background:var(--creme);border-radius:24px;overflow:hidden;box-shadow:6px 7px 0 rgba(92,10,36,.28);display:flex;flex-direction:column;color:var(--tinta)}
.vars{display:grid;gap:3px;background:var(--tinta);grid-template-columns:1fr}
.vars.n2{grid-template-columns:1fr 1fr}.vars.n3{grid-template-columns:repeat(3,1fr)}
.tile{position:relative;height:270px;background:var(--rosa);overflow:hidden}
.tile.alto{height:380px}
.tile.baixo{height:150px}
.tile svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tile .rot{position:absolute;left:10px;bottom:8px;font:800 13px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;background:var(--creme);color:var(--tinta);padding:5px 8px 3px;border-radius:6px;z-index:2}
.tile.tleg{height:100px}
.legwrap{position:absolute;left:0;top:0;transform-origin:0 0;width:1080px;height:300px}
.legwrap .leg{position:absolute!important}
.tile .erro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 13px var(--texto);padding:16px;color:var(--creme);text-align:center}
html[data-fundo=cereja] .tile:not(.fixo){background:var(--cereja)}
html[data-fundo=rosa] .tile:not(.fixo){background:var(--rosa)}
html[data-fundo=creme] .tile:not(.fixo){background:var(--creme)}
html[data-fundo=lilas] .tile:not(.fixo){background:var(--lilas)}
html[data-fundo=verde] .tile:not(.fixo){background:var(--verde)}
html[data-fundo=amarelo] .tile:not(.fixo){background:var(--amarelo)}
html[data-fundo=roxo] .tile:not(.fixo){background:var(--roxo)}
.info{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.info h3{margin:0;font:900 30px/.95 var(--display);text-transform:uppercase;color:var(--cereja)}
.info code{font:600 13px/1 ui-monospace,Consolas,monospace;background:rgba(92,10,36,.09);padding:3px 6px;border-radius:5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font:800 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px 3px;border-radius:999px;background:var(--tinta);color:var(--creme)}
.tag.c{background:var(--cereja)}.tag.v{background:var(--verde)}.tag.r{background:var(--roxo)}
.info p{margin:0;font-size:14px}
.info p b{font:800 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:2px;opacity:.65}
.info p.nao b{color:var(--cereja);opacity:1}
.params{display:flex;flex-wrap:wrap;gap:5px}
.params span{font:600 12px/1 ui-monospace,Consolas,monospace;background:rgba(92,10,36,.07);padding:4px 6px;border-radius:5px}
.params span i{font-style:normal;opacity:.55}
.mov{font-size:13px;border-top:2px dashed rgba(92,10,36,.25);padding-top:8px;margin-top:auto}
/* cores e regras */
.cores{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:10px 0 26px}
.cor{border-radius:18px;padding:16px 14px 12px;height:120px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:5px 6px 0 rgba(92,10,36,.25)}
.cor b{font:900 24px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.cor span{font:600 12px/1.2 ui-monospace,Consolas,monospace;opacity:.85}
.regras{columns:2 380px;column-gap:34px;padding-left:20px;margin:6px 0 26px;font-size:16px;color:var(--creme)}
.regras li{margin-bottom:9px;break-inside:avoid}
.bloco.claro .regras{color:var(--tinta)}
.cam{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:6px 0 26px}
.cam div{background:var(--creme);color:var(--tinta);border-radius:16px;padding:14px 16px;font-size:14px;box-shadow:4px 5px 0 rgba(92,10,36,.25)}
.cam b{display:block;font:900 24px/1 var(--display);text-transform:uppercase;color:var(--cereja);margin-bottom:4px}
footer{padding:36px 6vw 60px;color:var(--creme);font-size:14px;opacity:.9}
.vazio{display:none;color:var(--creme);font:800 24px var(--display);letter-spacing:.1em;text-transform:uppercase;padding:30px 6vw}
@media (max-width:700px){nav.barra{position:static}nav.barra input{width:100%}}
@media (max-width:640px){.cam{grid-template-columns:1fr}.tile{height:210px}}
</style>

  <span class="eyebrow" id="eyebrow">Design system · versão</span>
  <h1>Comida<em>viva</em></h1>
  <p>Todas as peças fixas do sistema numa página só. Cada uma aparece em movimento do jeito que será usada nos reels. O modelo só escolhe qual peça, onde e quando: nunca redesenha.</p>
  <div class="meta" id="meta"></div>
</header>

<nav class="barra" id="barra"></nav>

<section class="bloco" id="fundamentos">
  <span class="eyebrow">Fundamentos</span>
  <h2>Cores <small>e regras</small></h2>
  <div class="cores" id="cores"></div>
  <ul class="regras" id="regrasCor"></ul>
  <h2 style="font-size:46px;margin-top:10px">Regras de ouro</h2>
  <ul class="regras" id="regras"></ul>
  <div class="cam" id="camadas"></div>
</section>

<div id="familias"></div>
<div class="vazio" id="vazio">Nenhuma peça com esse filtro.</div>

<footer id="rodape"></footer>

<script>
// ===== elementos.js =====
// Elementos ilustrados da cartilha (v1). Cada um é uma peça fixa: o mesmo desenho sempre, só muda o parâmetro de movimento.
// Estilo: formas chapadas com luz e sombra (sem contorno preto), sombra dura deslocada, cores da Liv Up.
// Sem filter:blur. Tudo é função de (p, t): p = progresso da ação (0..1), t = tempo em segundos (ondas, vapor, bolhas).
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const C = { cereja: "#E50145", cerejaEsc: "#B80037", rosa: "#FF87A0", laranja: "#F15A22", laranjaEsc: "#C9430F", areia: "#F5D69E",
    amarelo: "#EFD600", creme: "#FFF9E9", verde: "#0C893E", verdeEsc: "#096B31", menta: "#63E578", roxo: "#962E9D", roxoEsc: "#6F2275",
    lilas: "#FAC7FF", tinta: "#5C0A24" };
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const ease = (x) => 1 - Math.pow(1 - x, 3);
  const back = (x) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const el = (tipo, attrs, pai) => { const e = document.createElementNS(NS, tipo); for (const k in attrs) e.setAttribute(k, attrs[k]); if (pai) pai.appendChild(e); return e; };
  const rnd = (i) => { const x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); };
  let uid = 0;
  // catálogo: cada peça se registra com a sua ficha (o manifesto.json é gerado daqui, nunca escrito à mão)
  const catalogo = [];
  const reg = (m) => { catalogo.push(m); return m; };
  const SOMBRA = { fill: C.tinta, "fill-opacity": .24 };   // sombra dura: a silhueta deslocada, sem blur
  const grupo = (pai, x, y, s) => el("g", { transform: `translate(${x} ${y}) scale(${s})` }, pai);

  // ---------- FORMA-ASSINATURA: retângulo de cantos grandes com as bordas de cima e de baixo inclinadas (skewY -10°)
  // caixa local: x 20..220, y ~1..237; centro ~ (120,144)
  function forma(pai, cor, { x = 0, y = 0, s = 1, sombra = null } = {}) {
    const g = grupo(pai, x, y, s);
    if (sombra) { const m = el("g", { transform: "translate(14 12) translate(0 50) skewY(-10)" }, g); el("rect", { x: 20, y: 40, width: 200, height: 150, rx: 44, fill: sombra }, m); }
    const m = el("g", { transform: "translate(0 50) skewY(-10)" }, g);
    el("rect", { x: 20, y: 40, width: 200, height: 150, rx: 44, fill: cor }, m);
    return g;
  }

  // ---------- POTE com vitamina que enche. p: 0 vazio .. 1 cheio. Frutas caem dentro, a onda se mexe.
  function pote(pai, { x = 0, y = 0, s = 1 } = {}) {
    const id = "j" + (uid++);
    const g = grupo(pai, x, y, s);
    const corpo = "M44 70H156C170 70 176 80 176 94V252C176 274 162 288 140 288H60C38 288 24 274 24 252V94C24 80 30 70 44 70Z";
    el("path", { d: corpo, transform: "translate(20 16)", ...SOMBRA }, g);
    const defs = el("defs", {}, g);
    el("path", { d: corpo }, el("clipPath", { id }, defs));
    const gr = el("linearGradient", { id: id + "g", x1: 0, y1: 0, x2: 1, y2: 0 }, defs);
    [[0, "#BE63CA"], [.5, C.roxo], [1, C.roxoEsc]].forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, gr));
    el("path", { d: corpo, fill: "#fff", "fill-opacity": .45 }, g);
    const canudo = el("g", { transform: "rotate(12 100 70)" }, g);
    el("rect", { x: 112, y: -50, width: 14, height: 250, rx: 7, fill: C.creme }, canudo);
    el("rect", { x: 120, y: -50, width: 6, height: 250, rx: 3, fill: "#000", "fill-opacity": .08 }, canudo);
    [-20, 30, 80].forEach((yy) => el("rect", { x: 112, y: yy, width: 14, height: 9, fill: C.cereja }, canudo));
    const liq = el("g", { "clip-path": `url(#${id})` }, g);
    const corpoLiq = el("path", { fill: `url(#${id}g)` }, liq);
    const espuma = el("path", { fill: C.lilas }, liq);
    const bolhas = [...Array(7)].map(() => el("circle", { fill: "#fff", "fill-opacity": .5 }, liq));
    const ondulas = el("ellipse", { cx: 100, rx: 0, ry: 0, fill: "none", stroke: "#fff", "stroke-width": 3, "stroke-opacity": .8 }, liq);
    el("rect", { x: 36, y: 96, width: 12, height: 150, rx: 6, fill: "#fff", "fill-opacity": .55 }, g);
    el("rect", { x: 156, y: 100, width: 10, height: 140, rx: 5, fill: "#000", "fill-opacity": .08 }, g);
    el("rect", { x: 28, y: 60, width: 144, height: 16, rx: 8, fill: "#fff", "fill-opacity": .85 }, g);
    // hortelã e laranja na borda
    [[152, 52, -28], [172, 60, 20]].forEach(([cx, cy, r]) => { const f = el("g", { transform: `translate(${cx} ${cy}) rotate(${r})` }, g);
      el("ellipse", { rx: 17, ry: 8, fill: C.verde }, f); el("path", { d: "M-15 0H14", stroke: C.menta, "stroke-width": 2.5, "stroke-linecap": "round" }, f); });
    const frutas = [[78, "laranja"], [104, "rosa"], [130, "roxo"]].map(([fx, tipo]) => {
      const f = el("g", {}, g);
      if (tipo === "laranja") { el("circle", { r: 15, fill: C.laranja }, f); el("circle", { r: 10, fill: "#FFA23A" }, f); el("path", { d: "M-10 0H10M0 -10V10", stroke: C.creme, "stroke-width": 2 }, f); }
      else { el("circle", { r: 14, fill: tipo === "rosa" ? C.cereja : C.roxoEsc }, f); el("ellipse", { cx: -4, cy: -5, rx: 4, ry: 3, fill: "#fff", "fill-opacity": .7 }, f); }
      f.fx = fx; return f;
    });
    const NIVEL_VAZIO = 286, NIVEL_CHEIO = 98;
    const onda = (path, nivel, amp, fase, base) => {
      let d = ""; for (let xx = -4; xx <= 204; xx += 8) d += (xx < 0 ? "M" : "L") + xx + " " + (nivel + amp * Math.sin(xx * .09 + fase)).toFixed(1);
      path.setAttribute("d", d + `V${base}H-4Z`);
    };
    return { g, set(p, t = 0) {
      const nivel = NIVEL_VAZIO - (NIVEL_VAZIO - NIVEL_CHEIO) * ease(clamp(p));
      const amp = p <= 0 ? 0 : 5 * (1 - .55 * clamp(p));
      onda(corpoLiq, nivel, amp, t * 5, 320); onda(espuma, nivel - 9, amp, t * 5 + 1.3, nivel + 4);
      espuma.setAttribute("opacity", p <= 0 ? 0 : 1); corpoLiq.setAttribute("opacity", p <= 0 ? 0 : 1);
      bolhas.forEach((b, i) => { const alt = NIVEL_VAZIO - nivel; const cy = NIVEL_VAZIO - ((t * 34 + i * 43) % Math.max(alt, 20));
        b.setAttribute("cx", 48 + (i * 23) % 100); b.setAttribute("cy", cy); b.setAttribute("r", 2.5 + (i % 3));
        b.setAttribute("opacity", p > 0 && cy > nivel + 10 ? 1 : 0); });
      frutas.forEach((f, k) => { const t0 = [.06, .26, .46][k], loc = clamp((p - t0) / .2);
        const yy = -80 + (nivel - 14 + 80) * loc * loc;
        f.setAttribute("transform", `translate(${f.fx} ${yy}) rotate(${loc * 300})`); f.setAttribute("opacity", loc > 0 && loc < 1 ? 1 : 0); });
      const rr = clamp((p - .26) / .14); // marola quando a fruta cai
      const marola = [.26, .46].map((t0) => clamp((p - t0 - .2) / .12)).find((v) => v > 0 && v < 1);
      ondulas.setAttribute("cy", nivel); ondulas.setAttribute("rx", marola ? 14 + 60 * marola : 0); ondulas.setAttribute("ry", marola ? 3 + 8 * marola : 0);
      ondulas.setAttribute("stroke-opacity", marola ? .8 * (1 - marola) : 0);
    } };
  }

  // ---------- MARMITA vista de cima. p: 0 fechada .. 1 aberta. A tampa levanta, desliza e some; sai vapor; a comida dá um pulinho.
  function marmita(pai, { x = 0, y = 0, s = 1, cor = C.cereja, corEsc = C.cerejaEsc } = {}) {
    const g = grupo(pai, x, y, s);
    el("rect", { x: 10, y: 10, width: 300, height: 200, rx: 30, transform: "translate(18 15)", ...SOMBRA }, g);
    el("rect", { x: 10, y: 10, width: 300, height: 200, rx: 30, fill: cor }, g);
    el("rect", { x: 20, y: 20, width: 280, height: 180, rx: 22, fill: corEsc }, g);
    const comida = el("g", {}, g);
    [[30, 30, 140, 160], [180, 30, 110, 75], [180, 115, 110, 75]].forEach(([xx, yy, w, h]) => el("rect", { x: xx, y: yy, width: w, height: h, rx: 16, fill: "#fff" }, comida));
    for (let i = 0; i < 64; i++) { const a = rnd(i + 1) * Math.PI * 2, r = Math.sqrt(rnd(i + 90)) * 62;
      el("ellipse", { cx: 100 + r * Math.cos(a) * 1.0, cy: 112 + r * Math.sin(a) * 1.15, rx: 7, ry: 4, fill: i % 4 ? C.creme : C.areia, transform: `rotate(${rnd(i) * 180} ${100 + r * Math.cos(a)} ${112 + r * Math.sin(a) * 1.15})` }, comida); }
    for (let i = 0; i < 5; i++) { const bx = 120 + (i % 3) * 22, by = 52 + Math.floor(i / 3) * 24 + (i % 2) * 8;
      [[0, 0, 13], [-11, 7, 10], [10, 8, 10], [0, 11, 9]].forEach(([dx, dy, r], k) => el("circle", { cx: bx + dx, cy: by + dy, r, fill: k % 2 ? C.verde : C.verdeEsc }, comida));
      el("circle", { cx: bx - 3, cy: by - 4, r: 4, fill: C.menta }, comida); }

// Família LAYOUT: as peças que montam a tela de um reel com apresentador: chip (rótulo), painel (janela de movimento),

  // CHIP: rótulo com borda duplicada deslocada (a "borda dupla" da marca). Pode ser botão, título de painel ou palavra-chave.

    el("rect", { x: xx, y, width: w, height: h, rx: 12, fill: cor }, g);
    el("text", { x: xx + w / 2, y: y + h - fs * .3, "text-anchor": "middle", "font-size": fs, fill: tc, style: UI }, g).textContent = txt;
    g.w = w; g.h = h; g.cx = xx + w / 2; g.cy = y + h / 2; return g;
  };

// Família TEXTO: o texto que se move. Letra a letra, palavras que sobem, contorno que enche, carimbo, faixa que rola,
// roleta de palavras, riscado→novo e marca-texto. Mesmo estilo: letra chapada, sombra dura (cópia deslocada), sem contorno preto, sem blur.

(() => {
  const { C, el, clamp, ease, back, reg } = EL;
  const lim = (x) => clamp(x, 0, 1);
  const DISP = 'font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:900;text-transform:uppercase';
  const sb = (fs) => Math.max(4, Math.round(fs * .05));            // deslocamento da sombra dura
  const nova = (pai, x = 0, y = 0, s = 1, rot = 0) => { const g = el("g", {}, pai); g.setAttribute("transform", `translate(${x} ${y}) rotate(${rot}) scale(${s})`); return g; };
  const fontesOk = () => { try { return document.fonts.check('900 40px "Barlow Condensed"'); } catch (e) { return false; } };   // só vale com a fonte já carregada
  let med = null, nid = 0;
  const larg = (str, fs) => {
    if (!med) { const sv = el("svg", { width: 10, height: 10, style: "position:absolute;left:-99px;top:-99px;visibility:hidden" }, document.body); med = el("text", { style: DISP }, sv); }

  const guarda = (fn) => { let f = null; return () => { const ok = fontesOk(); if (ok !== f) { f = ok; fn(); } }; };   // refaz a medida quando a fonte chega
  const tx = (pai, x, y, str, fs, fill, anchor = "middle") => { const e = el("text", { x, y, "font-size": fs, "text-anchor": anchor, fill, style: DISP }, pai); e.textContent = str; return e; };

  const BASE = [{ nome: "x", padrao: 0 }, { nome: "y", padrao: 0 }, { nome: "s", padrao: 1 }, { nome: "rot", padrao: 0 }];
  const ficha = (id, nome, serve, nao, caixa, params, mov) => reg({ id, nome, familia: "texto", tipo: "texto", serve_para: serve, nao_usar_quando: nao, camada: "frente", caixa, parametros: [...BASE, ...params], movimento: mov });
  const mov = (duracao_s, descricao) => ({ param: "p", duracao_s, descricao, usa_t: false });

  // ---------- LETRAS: cada letra salta de baixo, uma depois da outra

    [{ nome: "txt", padrao: "COMIDA" }, { nome: "fs", padrao: 160 }, { nome: "cor", padrao: "creme" }], mov(1.2, "as letras saltam de baixo, com leve giro, da esquerda para a direita"));

// ===== fundos.js =====
// Família FUNDOS: os padrões que ficam atrás de tudo (camada "fundo"). Cada um preenche a tela inteira (1080x1920, origem no canto
// superior esquerdo) com uma cor base e um desenho que anda devagar. Movimento contínuo: set(t), t em segundos. Sem blur.
// Regra de cor: o fundo base segue as regras_de_cor do manifesto (cereja em metade dos fundos); cor2 é só o desenho, nunca outra cor forte.
(() => {
  const { C, el, reg } = EL;
  let nf = 0;
  const L = 1080, A = 1920;
  const ficha = (id, nome, serve, nao, params, descricao) => reg({ id, nome, familia: "fundos", tipo: "padrao", serve_para: serve, nao_usar_quando: nao, camada: "fundo", caixa: { w: L, h: A },
    parametros: [{ nome: "cor", padrao: "cor base" }, { nome: "cor2", padrao: "cor do desenho" }, ...params], movimento: { param: "t", duracao_s: null, descricao, usa_t: true } });
  const base = (g, cor) => el("rect", { width: L, height: A, fill: cor }, g);
  const cobre = (g, id) => el("rect", { x: -500, y: -500, width: L + 1000, height: A + 1000, fill: `url(#${id})` }, g);
  const padrao = (g, w, h) => { const id = "fd" + (nf++); return [id, el("pattern", { id, width: w, height: h, patternUnits: "userSpaceOnUse" }, el("defs", {}, g))]; };

  // ---------- XADREZ: toalha de piquenique que desliza na diagonal
  const xadrez = (pai, { cor = C.rosa, cor2 = C.creme, tam = 120, vel = [30, 18] } = {}) => {
    const g = el("g", {}, pai); base(g, cor); const [id, pt] = padrao(g, tam * 2, tam * 2);
    el("rect", { width: tam, height: tam, fill: cor2, "fill-opacity": .55 }, pt); el("rect", { x: tam, y: tam, width: tam, height: tam, fill: cor2, "fill-opacity": .55 }, pt); cobre(g, id);
    return { g, set(t) { pt.setAttribute("patternTransform", `translate(${t * vel[0]} ${t * vel[1]})`); } };
  };
  ficha("xadrez", "Xadrez (toalha)", "fundo de cozinha e mesa posta: calmo, afetivo, bom para texto grande por cima", "a cena já tem muitos objetos pequenos (poluição)", [{ nome: "tam", padrao: 120 }, { nome: "vel", padrao: "[30,18]" }], "a toalha desliza na diagonal, devagar");

  // ---------- LISTRAS: faixas inclinadas que andam de lado
  const listras = (pai, { cor = C.cereja, cor2 = C.cerejaEsc, larg = 90, ang = -24, vel = 40 } = {}) => {

// ===== transicoes.js =====
// Família TRANSIÇÕES: o que cobre a tela para trocar de cena. Todas seguem o MESMO contrato:
//   set(p): p = 0 tela limpa · p = 0,5 tela totalmente coberta (é aqui que se troca a cena) · p = 1 tela limpa de novo.
// Tela cheia (1080x1920, origem no canto superior esquerdo), camada "frente". cor = cobertura principal; cor2 = acento (opcional).
// Dica: use cor = a cor de fundo da cena que vem a seguir; o corte some dentro da cobertura.
(() => {
  const { C, el, clamp, ease, reg, forma } = EL;
  const lim = (x) => clamp(x, 0, 1), L = 1080, A = 1920;
  const S = (p) => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);      // entra e sai suave, contínuo
  const ficha = (id, nome, serve, nao, params) => reg({ id, nome, familia: "transicoes", tipo: "transicao", serve_para: serve, nao_usar_quando: nao, camada: "frente", caixa: { w: L, h: A },
    parametros: [{ nome: "cor", padrao: "cor da cena seguinte" }, { nome: "cor2", padrao: "acento (opcional)" }, ...params],
    movimento: { param: "p", duracao_s: .7, descricao: "p=0 limpa; p=0,5 tela coberta (troque a cena); p=1 limpa", usa_t: false } });
  const vis = (g, p) => g.setAttribute("opacity", p > 0 && p < 1 ? 1 : 0);

  // ---------- CORTINA DE FORMA: a Forma gigante atravessa a tela
  const cortinaForma = (pai, { cor = C.cereja } = {}) => {
    const g = el("g", {}, pai); forma(g, cor, { x: 0, y: 0, s: 14 });
    return { g, set(p) { vis(g, p); g.setAttribute("transform", `translate(${-1500 + 4080 * S(p) - 120 * 14} ${960 - 144 * 14})`); } };
  };
  ficha("cortina_forma", "Cortina de Forma", "a transição da marca: a Forma gigante atravessa a tela da esquerda para a direita", "a cena seguinte tem o mesmo fundo (não dá para ver a troca)", []);

css.textContent = `html[data-fundo=auto] #f-texto .tile:not(.fixo){background:var(--cereja)}html[data-fundo=auto] #f-layout .tile:not(.fixo){background:var(--rosa)}html[data-fundo=auto] #f-forma .tile,html[data-fundo=auto] #f-ingrediente .tile{background:var(--lilas)}html[data-fundo=auto] #f-talher .tile,html[data-fundo=auto] #f-utensilio .tile,html[data-fundo=auto] #f-louca .tile{background:var(--creme)}html[data-fundo=auto] #f-cozinha .tile{background:var(--rosa)}`;
document.head.appendChild(css);

let t0 = performance.now(), pausadoEm = 0, deslocado = 0;
function laco(agora) {
  if (window._pausado) { if (!pausadoEm) pausadoEm = agora; } else { if (pausadoEm) { deslocado += agora - pausadoEm; pausadoEm = 0; } }
  const tt = ((window._pausado ? pausadoEm : agora) - t0 - deslocado) / 1000;
  tiles.forEach((o) => { if (o.vis && !o.erro && o.passo) { try { o.passo(tt); } catch (e) { o.erro = true; console.error(o.F.id, e); } } });
  requestAnimationFrame(laco);
}

topo();
const arranca = () => { construirTudo(); requestAnimationFrame(laco); window._pronto = true; };
const f1 = document.fonts.load('900 40px "Barlow Condensed"'), f2 = document.fonts.load('600 20px "Outfit"');
Promise.race([Promise.all([f1, f2]).then(() => document.fonts.ready), new Promise((r) => setTimeout(r, 2500))]).then(arranca);
})();
