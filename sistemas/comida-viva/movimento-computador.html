<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Movimento · computador</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&family=Outfit:wght@700&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#FFD400}svg{display:block}text{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:900;text-transform:uppercase}</style>
<body>
<svg id="tela" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
<script src="elementos.js"></script>
<script src="cozinha.js"></script>
<script src="layout.js"></script>
<script src="computador.js"></script>
<script src="dados.js"></script>
<script>
// Seis cenas de computador (2,8 s cada; 16,8 s). Composições diferentes: pasta, terminal, tabela + gráfico, fluxo + número, chat, organização.
const {C,el,clamp,ease,back,forma}=EL, K=EL;
const tela=document.getElementById("tela"), lim=(x)=>clamp(x,0,1), T=2.8;
const defs=el("defs",{},tela);
const pat=el("pattern",{id:"pad",width:200,height:190,patternUnits:"userSpaceOnUse"},defs);
el("rect",{x:20,y:36,width:150,height:110,rx:34,fill:"#fff","fill-opacity":.1,transform:"translate(0 8) skewY(-10)"},pat);
const bg=el("rect",{width:1080,height:1920},tela), pt=el("rect",{x:-200,y:-200,width:1480,height:2320,fill:"url(#pad)"},tela);
const pop=(g,cx,cy,u,at=0,dur=.45)=>{const p=back(lim((u-at)/dur));g.setAttribute("opacity",lim((u-at)/.15));g.setAttribute("transform",`translate(${cx} ${cy}) scale(${.5+.5*p}) translate(${-cx} ${-cy})`)};
const queda=(u,at=.2)=>1-back(lim((u-at)/.6));
const cenas=[];
const cena=(bgc,titulo,build)=>{const g=el("g",{},tela);const c=K.chip(g,titulo,{x:60,y:140,fs:84});cenas.push({bg:bgc,g,c,upd:build(g)})};

// 1 · a pasta abre
cena(C.cereja,"Abre a pasta",(g)=>{const o=el("g",{},g),p=K.pasta(o,{x:0,y:0,s:3.2,rotulo:"CONTEXTO"}),a=K.documento(el("g",{},g),{x:230,y:1500,s:1.5,tipo:"lista"}),b=K.lupa(el("g",{},g),{x:760,y:1530,s:1.7});
  return(u,t)=>{o.setAttribute("transform",`translate(540 ${900-queda(u)*900})`);p.set(lim((u-.6)/1.4));a.set(lim((u-1.2)/1.2));b.set(1,t)}});
// 2 · o terminal executa
cena(C.rosa,"Executa",(g)=>{const o=el("g",{},g),tm=K.terminal(o,{x:0,y:0,s:1.85,linhas:["$ ler pasta","> 12 notas lidas","$ atualizar","> 3 notas novas"]}),e=K.engrenagem(el("g",{},g),{x:300,y:1450,s:2.3}),e2=K.engrenagem(el("g",{},g),{x:470,y:1330,s:1.4,cor:C.amarelo}),n=K.nuvem(el("g",{},g),{x:800,y:1420,s:1.7});
  return(u,t)=>{o.setAttribute("transform",`translate(540 ${820-queda(u)*900})`);tm.set(lim((u-.5)/1.9),u);e.set(1,u);e2.set(1,-u);n.set(1,u)}});
// 3 · tabela + gráfico
cena(C.cereja,"Lê os dados",(g)=>{const a=K.tabela(el("g",{},g),{x:540,y:620,s:1.6,cor:C.roxo}),b=K.barras(el("g",{},g),{x:540,y:1340,s:1.45}),c=K.cursor(el("g",{},g),{x:540,y:620,s:2.4,rota:[[200,260],[-120,10]]});
  return(u,t)=>{a.set(lim((u-.3)/1.4));b.set(lim((u-1.1)/1.4));c.set(lim((u-.9)/1.0))}});
// 4 · a informação flui
cena(C.amarelo,"A informação flui",(g)=>{const f=K.fluxo(el("g",{},g),{x:540,y:620,s:1.4,nos:["pasta","engrenagem","documento"],cores:[C.amarelo,C.laranja,C.cereja]}),n=K.numero(el("g",{},g),{x:540,y:1320,s:1.5,valor:87,sufixo:"%",cor:C.cereja,legenda:"NOTAS ATUALIZADAS"}),m=K.medidor(el("g",{},g),{x:540,y:1640,s:.8,valor:.82,rotulo:"Meta"});
  return(u,t)=>{f.set(lim((u-.2)/1.2),t);n.set(lim((u-1.0)/1.4));m.set(lim((u-1.6)/1.0))}});
// 5 · a conversa
cena(C.cereja,"Conversa",(g)=>{const a=K.balao(el("g",{},g),{x:400,y:520,s:2.1,lado:"esq",linhas:3}),b=K.balao(el("g",{},g),{x:690,y:980,s:2.1,lado:"dir",cor:C.roxo,tc:C.lilas,linhas:3}),c=K.balao(el("g",{},g),{x:400,y:1440,s:2.1,lado:"esq",linhas:2});
  return(u,t)=>{a.set(lim((u-.3)/1.1),t);b.set(lim((u-1.0)/1.1),t);c.set(lim((u-1.7)/1.0),t)}});
// 6 · organiza o dia
cena(C.lilas,"Organiza o dia",(g)=>{const a=K.checklista(el("g",{},g),{x:540,y:560,s:1.6}),b=K.calendario(el("g",{},g),{x:330,y:1180,s:1.3}),c=K.email(el("g",{},g),{x:800,y:1250,s:1.5}),d=K.imagem(el("g",{},g),{x:540,y:1640,s:1.0});
  return(u,t)=>{a.set(lim((u-.3)/1.8));b.set(lim((u-.9)/1.4));c.set(lim((u-1.5)/.9));d.set(lim((u-1.8)/1.0),t)}});

const cort=cenas.slice(1).map((c)=>{const g=el("g",{},tela);forma(g,c.bg,{x:0,y:0,s:14});return g});
window.render=(t)=>{
  const i=Math.min(cenas.length-1,Math.floor(t/T)),u=t-i*T,c=cenas[i];
  bg.setAttribute("fill",c.bg);pt.setAttribute("patternTransform",`translate(${t*14} ${t*9})`);
  cenas.forEach((q,k)=>q.g.setAttribute("opacity",k===i?1:0));
  pop(c.c,c.c.cx,c.c.cy,u,.05);c.upd(u,t);
  cort.forEach((g,k)=>{const ativa=(k===i&&i<cenas.length-1&&u>T-.6);g.setAttribute("opacity",ativa?1:0);if(ativa){const e=ease(lim((u-(T-.6))/.55));g.setAttribute("transform",`translate(${-1500+(540+1500)*e-120*14} ${960-144*14})`)}});
};
window.render(0);
document.fonts.ready.then(()=>{window._pronto=true});
</script>
</body>
</html>
