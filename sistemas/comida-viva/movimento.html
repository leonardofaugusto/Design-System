<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Movimento · pote e marmita</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&family=Outfit:wght@600&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#FAC7FF}svg{display:block}text{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:900;text-transform:uppercase}</style>
<body>
<svg id="tela" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
<script src="elementos.js"></script>
<script>
// Cena de movimento (4 s de pote + 3,6 s de marmita). Tudo é função do tempo: window.render(t).
const {C,el,clamp,ease,back,forma,pote,marmita}=EL;
const tela=document.getElementById("tela");
const bg=el("rect",{width:1080,height:1920,fill:C.lilas},tela);
const lim=(x)=>clamp(x,0,1);

// ---- cena A: pote (lilás, forma cereja)
const A=el("g",{},tela);
const fA=el("g",{},A); forma(fA,C.cereja,{x:0,y:0,s:4.4,sombra:"rgba(42,11,46,.25)"});
const tA1=el("text",{x:70,y:250,"font-size":200,fill:C.cereja},A); tA1.textContent="Enche";
const tA2=el("text",{x:70,y:430,"font-size":200,fill:C.roxo},A); tA2.textContent="o pote";
const gP=el("g",{},A); const P=pote(gP,{x:0,y:0,s:3.2});

// ---- cortina: forma verde gigante varre a tela
const cort=el("g",{},tela); forma(cort,C.verde,{x:0,y:0,s:14});

// ---- cena B: marmita (verde, forma amarela)
const B=el("g",{},tela);
const fB=el("g",{},B); forma(fB,C.amarelo,{x:0,y:0,s:4.4,sombra:"rgba(42,11,46,.25)"});
const tB1=el("text",{x:70,y:250,"font-size":200,fill:C.creme},B); tB1.textContent="Abre a";
const tB2=el("text",{x:70,y:430,"font-size":200,fill:C.amarelo},B); tB2.textContent="marmita";
const gM=el("g",{},B); const M=marmita(gM,{x:0,y:0,s:2.7,cor:C.roxo,corEsc:C.roxoEsc});
const btn=el("g",{},B);
el("rect",{x:6,y:6,width:300,height:104,rx:12,fill:"none",stroke:C.creme,"stroke-width":3},btn);
el("rect",{width:300,height:104,rx:12,fill:C.creme},btn);
const bt=el("text",{x:150,y:78,"font-size":72,"text-anchor":"middle",fill:C.verde},btn); bt.textContent="Siga";

// texto que pula para dentro, ancorado no canto esquerdo da linha de base
const pop=(g,x,y,t,at)=>{const p=back(lim((t-at)/.45));const o=lim((t-at)/.2);g.setAttribute("opacity",o);g.setAttribute("transform",`translate(${x} ${y}) scale(${.55+.45*p}) translate(${-x} ${-y})`)};
const CT=1150; // centro vertical das formas
window.render=(t)=>{
  const emA=t<3.95, emB=t>=3.85;
  A.setAttribute("opacity",emA?1:0); B.setAttribute("opacity",emB?1:0);
  bg.setAttribute("fill",t<3.85?C.lilas:C.verde);
  // A
  const eF=back(lim(t/.55));
  fA.setAttribute("transform",`translate(540 ${CT}) rotate(${(1-eF)*-8}) scale(${.5+.5*eF}) translate(-540 ${-CT}) translate(${540-120*4.4} ${CT-144*4.4})`);
  pop(tA1,70,250,t,.15); pop(tA2,70,430,t,.35);
  const queda=1-back(lim((t-.4)/.6)); // o pote cai de cima e assenta
  gP.setAttribute("transform",`translate(${540-100*3.2} ${CT-175*3.2+30-queda*520})`);
  P.set(lim((t-1.2)/2.3),t);
  // cortina
  const c=ease(lim((t-3.35)/.55)), cx=-1500+(540+1500)*c;
  cort.setAttribute("transform",`translate(${cx-120*14} ${960-144*14})`); cort.setAttribute("opacity",t>3.3&&t<4.5?1:0);
  const sai=ease(lim((t-4.0)/.5)); // a cortina termina de passar para a direita
  if(t>=3.9) cort.setAttribute("transform",`translate(${cx+sai*2600-120*14} ${960-144*14})`);
  // B
  const tb=t-3.95, eB=back(lim(tb/.55));
  fB.setAttribute("transform",`translate(540 ${CT}) rotate(${(1-eB)*8}) scale(${.5+.5*eB}) translate(-540 ${-CT}) translate(${540-120*4.4} ${CT-144*4.4})`);
  pop(tB1,70,250,t,4.1); pop(tB2,70,430,t,4.3);
  const quedaM=1-back(lim((t-4.35)/.6));
  gM.setAttribute("transform",`translate(${540-160*2.7} ${CT-110*2.7+10-quedaM*520})`);
  M.set(lim((t-5.2)/2.0),t);
  const bp=back(lim((t-6.6)/.4));
  btn.setAttribute("opacity",lim((t-6.6)/.15));
  btn.setAttribute("transform",`translate(700 1640) translate(150 52) scale(${.4+.6*bp}) translate(-150 -52)`);
};
window.render(0);
document.fonts.ready.then(()=>{window._pronto=true});
</script>
</body>
</html>
