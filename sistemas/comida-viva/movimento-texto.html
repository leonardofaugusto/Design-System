<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Movimento · texto, fundos e transições</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#E50145}svg{display:block}text{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:900;text-transform:uppercase}</style>
<body>
<svg id="tela" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
<script src="elementos.js"></script>
<script src="cozinha.js"></script>
<script src="layout.js"></script>
<script src="texto.js"></script>
<script src="fundos.js"></script>
<script src="transicoes.js"></script>
<script>
// Seis cenas (3 s cada; 18 s): cada uma com um fundo, dois ou três textos em movimento e, entre elas, as cinco transições.
const K=EL, {C,el,clamp}=EL, tela=document.getElementById("tela"), lim=(x)=>clamp(x,0,1), T=3.0, TR=.7;
const cenas=[], P=(u,ini,dur)=>lim((u-ini)/dur);
const cena=(fundo,build)=>{const g=el("g",{},tela), f=fundo(g); const itens=build(g); cenas.push({g,f,itens})};

// 1 · cereja + raios: título em letras, tarja de marca-texto
cena((g)=>K.raios(g,{cor:C.cereja,cor2:C.cerejaEsc}),(g)=>{
  const a=K.letras(g,{x:540,y:760,txt:"COMIDA",fs:250,cor:C.creme}), b=K.letras(g,{x:540,y:1010,txt:"DE VERDADE",fs:210,cor:C.amarelo}), c=K.marca_texto(g,{x:540,y:1340,txt:"sem conservante",fs:120,rot:-2});
  return (u)=>{a.set(P(u,.1,1.1));b.set(P(u,.6,1.1));c.set(P(u,1.5,1.0))}});
// 2 · rosa + xadrez: carimbo e riscado
cena((g)=>K.xadrez(g,{cor:C.rosa,cor2:C.creme}),(g)=>{
  const a=K.carimbo(g,{x:540,y:760,txt:"APROVADO",fs:200,cor:C.cereja,rot:-8}), b=K.riscado(g,{x:540,y:1330,velho:"complicado",novo:"simples",fs:150,cor:C.cereja,risco:C.cereja,cnovo:C.cereja});
  return (u)=>{a.set(P(u,.2,.9));b.set(P(u,1.0,1.5))}});
// 3 · cereja + listras: roleta e palavras
cena((g)=>K.listras(g,{cor:C.cereja,cor2:C.cerejaEsc}),(g)=>{
  const a=K.roleta(g,{x:540,y:760,fs:230,palavras:["lento","caro","chato","gostoso"]}), b=K.palavras(g,{x:540,y:1250,fs:170,linhas:["sem pressa,","com sabor"],cores:[C.creme,C.amarelo]});
  return (u)=>{a.set(P(u,.2,1.6));b.set(P(u,1.4,1.2))}});
// 4 · creme + horta: contorno que enche e palavras
cena((g)=>K.horta(g,{cor:C.creme,cor2:C.verde}),(g)=>{
  const a=K.vazado(g,{x:540,y:760,txt:"FRESCO",fs:330,cor:C.verde}), b=K.palavras(g,{x:540,y:1250,fs:170,linhas:["do campo","pra mesa"],cores:[C.cereja,C.verde]});
  return (u)=>{a.set(P(u,.2,1.4));b.set(P(u,1.4,1.2))}});
// 5 · cereja + ondas: duas faixas que rolam e letras
cena((g)=>K.ondas(g,{cor:C.cereja,cor2:C.rosa}),(g)=>{
  const a=K.faixa(g,{x:540,y:620,txt:"COMIDA DE VERDADE",fs:130,cor:C.creme,tc:C.cereja,rot:-4,vel:260}), b=K.faixa(g,{x:540,y:1000,txt:"FEITO TODO DIA",fs:130,cor:C.amarelo,tc:C.tinta,rot:3,vel:-260}), c=K.letras(g,{x:540,y:1450,txt:"TODO DIA",fs:280,cor:C.creme});
  return (u)=>{a.set(1,u);b.set(1,u);c.set(P(u,.2,1.0))}});
// 6 · lilás + formas: o fechamento
cena((g)=>K.formas(g,{cor:C.lilas,cor2:C.roxo}),(g)=>{
  const a=K.palavras(g,{x:540,y:830,fs:300,linhas:["bora","pedir?"],cores:[C.cereja,C.roxo]}), b=K.carimbo(g,{x:540,y:1420,txt:"GRÁTIS",fs:210,cor:C.cereja,rot:5});
  return (u)=>{a.set(P(u,.1,1.2));b.set(P(u,1.3,.9))}});

// transições entre as cenas, cobrindo com a cor da cena seguinte
const BG=[C.cereja,C.rosa,C.cereja,C.creme,C.cereja,C.lilas], mk=[K.cortina_forma,K.fatias,K.cascata,K.iris,K.onda];
const trans=mk.map((f,i)=>f(tela,{cor:BG[i+1],cor2:C.amarelo}));

window.render=(t)=>{
  const i=Math.min(cenas.length-1,Math.floor(t/T)), u=t-i*T;
  cenas.forEach((c,k)=>c.g.setAttribute("opacity",k===i?1:0));
  cenas[i].f.set(t);cenas[i].itens(u);
  trans.forEach((tr,k)=>tr.set(lim((t-((k+1)*T-TR/2))/TR)));
};
// a troca de cena acontece junto com o meio da transição (p = 0,5)
window.render(0);
document.fonts.ready.then(()=>{window.render(0);window._pronto=true});
</script>
</body>
</html>
