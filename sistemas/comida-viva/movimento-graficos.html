<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Movimento · gráficos</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&family=Outfit:wght@700&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#FF87A0}svg{display:block}text{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:900;text-transform:uppercase}</style>
<body>
<svg id="tela" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
<script src="elementos.js"></script>
<script src="cozinha.js"></script>
<script src="layout.js"></script>
<script src="graficos.js"></script>
<script>
// Grade de teste: 3 peças (linhas) × 3 estilos (colunas), todas com os mesmos dados dentro da mesma peça. Dados de exemplo inventados.
const K=EL, {C,el,clamp}=EL, tela=document.getElementById("tela"), lim=(x)=>clamp(x,0,1), X=[190,540,890];
el("rect",{width:1080,height:1920,fill:C.rosa},tela);
const ps=[];
["pote","bag","marmita"].forEach((e,i)=>ps.push(K.progresso(tela,{x:X[i],y:440,s:.62,estilo:e,valor:.72,rotulo:"Meta do mês"})));
["frutas","marmitas","reguas"].forEach((e,i)=>ps.push(K.barras_comida(tela,{x:X[i],y:1040,s:.64,estilo:e})));
["deslizar","cartoes","celula"].forEach((e,i)=>ps.push(K.tabela_viva(tela,{x:X[i],y:1560,s:.58,estilo:e})));
window.render=(t)=>{const p=lim(t/2.6);ps.forEach((o)=>o.set(p,t))};
window.render(0);
document.fonts.ready.then(()=>{window.render(0);window._pronto=true});
</script>
</body>
</html>
